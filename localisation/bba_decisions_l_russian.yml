 form_empire_of_axum: "Восстановить Аксумскую империю"
 controls_KLGiopian_cores_tt: "Контролирует все [ROOT.GetAdjective]ие национальные территории."
 KLG_move_capital_to_axum: "Перенести столицу в Аксум"
 KLG_move_capital_to_axum_desc: "Новой столицей империи должен стать древний город Аксум."
 KLG_prevents_further_capital_moves_tt: "Перенос столицы в Иерусалим предотвращает дальнейшие переносы столицы."
 KLG_has_moved_capital_flag: " Столица уже была перенесена"
 form_empire_of_solomon: "Создать Империю Соломона"
 KLG_move_capital_to_jerusalem: "Сделать Иерусалим столицей империи"
 form_empire_of_zion: "Сионистская империя"
 create_empire_of_zion_tt: "Все регионы в Карибском море и на побережье Флориды, которые контролируются государством [ROOT.getNameDef] или являются марионетками, становятся его национальными территориями."
 KLG_liberate_SUD: "Освободить государство [SUD.GetName]"
 KLG_liberate_SUD_tt: "Дает цели войны против тех, кому принадлежит [SUD.GetAdjective]ая территория."
 KLG_liberate_DJI: "Освободить государство [DJI.GetName]"
 KLG_liberate_DJI_tt: "Дает цели войны против тех, кому принадлежит [DJI.GetAdjective]ая территория."
 KLG_liberate_KEN: "Освободить государство [KEN.GetName]"
 KLG_liberate_KEN_tt: "Дает цели войны против тех, кому принадлежит [KEN.GetAdjective]ая территория."
 KLG_liberate_ERI: "Освободить государство [ERI.GetName]"
 KLG_liberate_ERI_tt: "Дает цели войны против тех, кому принадлежит [ERI.GetAdjective]ая территория."
 KLG_liberate_SOM: "Освободить государство [SOM.GetName]"
 KLG_liberate_SOM_tt: "Дает цели войны против тех, кому принадлежит [SOM.GetAdjective]ая территория."
 KLG_liberate_UGA: "Освободить государство [UGA.GetName]"
 KLG_liberate_UGA_tt: "Дает цели войны против тех, кому принадлежит [UGA.GetAdjective]ая территория."
 KLG_offer_peace_SUD: "Предложить мир в обмен на независимость [SUD.GetAdjective]ой территории"
 KLG_offer_peace_SUD_tt: "Предложить мир владельцам [SUD.GetAdjective]ой территории, если они откажутся от притязаний на земли, которые в данный момент контролирует [KLG.GetName]. Находящаяся под контролем [SUD.GetAdjective]ой территория превратится в [KLG.GetAdjective]ую марионетку."
