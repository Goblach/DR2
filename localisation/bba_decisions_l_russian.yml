l_russian:
 #Decisions Menu
 war_escalation_text: "£generic_war_escalation_text_icon Уровень эскалации войны: §Y[?KLG.KLG_war_escalation_level]§!"
 war_escalation_level_tt: "§YТекущая эскалация войны§!\nУровень эскалации увеличивается с течением времени."
 war_escalation_icon_tt: "§YЭскалация войны§!\nЭффекты от нарастающей эскалации войны по уровням:\nУровень 3:\n §YЛига Наций§!: доступен вариант «Попросить ввести эмбарго».\n §YЭфиопия§!: увеличивается международная репутация.\nУровень 4:\n §YЛига Наций§!: доступен вариант «Закупка оружия».\n §YИталия§!: итальянская общественность обеспокоена.\nУровень 5:\n §YЛига Наций§!: доступен вариант «Закрытие Суэцкого канала».\n §YИталия§!: Армия Африки разочарована.\nУровень 6: \n §YЛига Наций§!: доступен вариант «Международные бригады».\n §YЭфиопия§!: повышен боевой дух армии.\n §YИталия§!: беспорядки в колониях.\nУровень 7: \n §YЛига Наций§!: доступен вариант «Международные посредники».\n§YИталия§!: итальянская общественность сомневается в правомерности военной экономики\nУровень 8:\n §YЭфиопия§!: дезертирство в рядах врага.\n §YИталия§!: массовое дезертирство.\nУровень 9:\n §YЭфиопия§!: выживание вопреки всему.\nУровень 10:\n §YЭфиопия§!: Народная война\n §YИталия§!: беспорядки в колониях."
 war_escalation_1_tt: "Уровень 1\n Нет эффектов"
 war_escalation_2_tt: "Уровень 2\n Нет эффектов"
 war_escalation_3_tt: "Уровень 3\n §YКалининград§!: прибытие добровольцев."
 war_escalation_4_tt: "Уровень 4\n §YКалининград§!: поддержка вооружением."
 war_escalation_5_tt: "Уровень 5\n §YКалининград§!: повышен боевой дух армии."
 war_escalation_6_tt: "Уровень 6\n §YКалининград§!: Калининград может запрашивать оружие.\n §YВесбария§!: пограничный конфликт со Шпротландом."
 war_escalation_7_tt: "Уровень 7\n §YКалининград§!: Калининград может запросить международные бригады."
 war_escalation_8_tt: "Уровень 8\n §YКалининград§!: дезертирство в рядах врага.\n §YЛубения и Весбария§!: массовое дезертирство."
 war_escalation_9_tt: "Уровень 9\n §YКалининград§!: выживание вопреки всему."
 war_escalation_10_tt: "Уровень 10\n §YКалининград§!: Народная война.\n §YЛубения§!: польская интервенция."
 KLG_trigger_fulfilled: "£trigger_yes"
 KLG_trigger_not_fulfilled: "£trigger_no"
 KLG_war_escalation_threat: "Эскалация итало-эфиопской войны"
 KLG_major_offensive_threat: "Крупная наступательная операция на фронте итало-эфиопской войны"
 KLG_improve_country_category: "Наступление войск страны [ROOT.GetName]"
 KLG_improve_country_category_desc: "Экономика [KLG.GetNameRuGen] держится в основном на сельском хозяйстве, где трудятся полунищие фермеры. Чтобы начать индустриализацию, нам нужны большие вложения в электрификацию и транспортную инфраструктуру — тогда больше людей сможет перебраться с ферм на заводы."
 KLG_build_local_resistance_force: "Создать войска сопротивления в регионе [FROM.GetName]"
 KLG_build_local_resistance_force_desc: "Мы должны сделать все, что в наших силах, чтобы поддерживать движение сопротивления на оккупированных территориях. Это поможет ослабить [ITA.GetAdjective]ую хватку в регионе и отвлечет противника, пока мы готовимся к неизбежному освобождению [KLG.GetNameRuGen]."
 KLG_build_local_resistance_force_increase_tt: "Нанимает §G1§! дивизию арбеньоков, которая может появиться в стране."
 KLG_build_local_resistance_force_cost: "£command_power §G25§!"
 KLG_build_local_resistance_force_cost_blocked: "£command_power §R25§!"
 KLG_building_local_resistance_flag: "В данный момент вербует бойцов Сопротивления"
 KLG_launch_large_scale_uprising: "Крупномасштабное восстание"
 KLG_launch_large_scale_uprising_desc: "Народ [KLG.GetNameRuGen] жаждет сбросить иго иностранной оккупации. Нужно лишь подтолкнуть его к этому."
 KLG_has_readied_uprising_tt: "Восстание подготовлено не менее чем в 1 стране"
 KLG_italian_uprising_warning_mission: "[KLG.GetName] ожидает неизбежного восстания"
 KLG_italian_uprising_warning_mission_desc: "По слухам, [KLG.GetLeader] призывает местных мятежников поднять восстание и напасть на войска страны [ROOT.GetName]."
 KLG_italian_uprising_warning_mission_tt: "Восстание начинается"
 KLG_coup_haile_selassie_imru: "Спровоцировать дворцовый переворот"
 KLG_coup_haile_selassie_imru_desc: "Демократически настроенный $KLG_ras_imru_haile_selassie$ правит страной в отсутствие императора. Несомненно, массы считают его истинным героем [ROOT.GetNameRuGen] после того, как он возглавлял страну во время войны. Сейчас все громче раздаются призывы демократизации [ROOT.GetNameRuGen]. Возможно, пришли времена, когда в государстве [ROOT.GetNameDef] действительно назрела необходимость перемен."
 KLG_palace_coup_tt: "§Y$KLG_ras_imru_haile_selassie$§! устраивает попытку переворота"
 KLG_formal_request_to_host: "Составить официальный запрос [?KLG.host_nation.GetAdjective]ому правительству."
 KLG_formal_request_to_host_desc: "Нужно обратиться к [?KLG.host_nation.GetAdjective]ому правительству и попросить его поддержать правителя [ROOT.GetLeader] в войне против [ITA.GetNameRuGen]. Так начнется последний этап возрождения нашей нации."
 KLG_false_flag_operation_decision: "Начать операцию под чужим флагом"
 KLG_false_flag_operation_decision_desc: "Принимающую сторону можно убедить в том, что [ITA.GetName] — ненадежный партнер, изобразив атаку на немецкий пограничный пост и обвинив в ней итальянцев."
 KLG_throw_grand_party_for_host: "Устроить пышный прием"
 KLG_throw_grand_party_for_host_desc: "Устроив роскошный прием в своем доме, [ROOT.GetLeader] создаст отличные условия для неформального общения перед официальной встречей."
 KLG_influence_host_cost: "§G10§! £GFX_KLG_imperial_treasury"
 KLG_influence_host_cost_blocked: "§R10§! £GFX_KLG_imperial_treasury"
 organization_of_african_unity_member_tt: "Является членом Организации африканского единства"
 KLG_take_loans: "Личные кредиты"
 KLG_take_loans_desc: "Мы можем попытаться увеличить доступные средства, используя императорскую казну в качестве обеспечения."
 KLG_take_loans_tt: "Казна фракции £GFX_KLG_imperial_treasury: §G+10§! \n"
 KLG_fundraising_campaign_decision: "Кампания по сбору средств"
 KLG_fundraising_campaign_decision_desc: "После того как президент [ROOT.GetLeader] выступил на радио, число наших сторонников в Америке значительно выросло. Нужно воспользоваться ситуацией и провести кампанию по сбору средств. Это поможет нам наполнить казну и, следовательно, профинансировать освободительную войну."
 KLG_low_fundraising_effect_tt: "Казна фракции £GFX_KLG_imperial_treasury: §G+5§! \n"
 KLG_medium_fundraising_effect_tt: "Казна фракции £GFX_KLG_imperial_treasury: §G+15§! \n"
 KLG_high_fundraising_effect_tt: "Казна фракции £GFX_KLG_imperial_treasury: §G+20§! \n"
 KLG_very_high_fundraising_effect_tt: "Казна фракции £GFX_KLG_imperial_treasury: §G+30§! \n"
 KLG_set_up_gideon_force_decision: "Отряд «Гидеон»"
 KLG_set_up_gideon_force_decision_desc: "[?KLG.host_nation.GetAdjective]ое правительство готово выделить средства на создание небольшого экспедиционного корпуса, который вступит в бой с захватчиками. Нужно немедленно воспользоваться этой возможностью!"
 KLG_set_up_gideon_force_decision_tt: "[?KLG.host_nation.GetAdjective]ий командир войск специального назначения временно присоединяется к [ROOT.GetAdjective]ой армии."
 KLG_recruit_mercenaries_host_cost: "§G[?KLG_recruit_mercenaries_cost]§! £GFX_KLG_imperial_treasury"
 KLG_recruit_mercenaries_host_cost_blocked: "§R[?KLG_recruit_mercenaries_cost]§! £GFX_KLG_imperial_treasury"
 KLG_recruit_mercenaries_from_host: "Вербовать наемников"
 KLG_recruiting_mercenaries_flag: "Вербовка наемников"
 KLG_recruit_mercenaries_from_host_desc: "Всегда найдутся люди, готовые воевать за деньги."
 KLG_recruit_aircrews_from_host: "Завербовать [?KLG.host_nation.GetAdjective]их пилотов"
 KLG_recruit_aircrews_from_host_desc: "Наверняка здесь найдутся [?KLG.host_nation.GetAdjective]ие пилоты и механики, которые готовы послужить стране [ROOT.GetName], если за это им хорошо заплатят."
 KLG_recruit_merchant_marines_from_host: "Приобрести гражданские корабли"
 KLG_recruit_merchant_marines_from_host_desc: "Чтобы перевезти нашу армию в Африку, нам понадобятся корабли и моряки."
 KLG_buy_rifles_from_host: "Купить [?KLG.host_nation.GetAdjective]ие винтовки."
 KLG_buy_rifles_from_host_desc: "Мы должны идти на жертвы, ведь только так [ROOT.GetName] снова обретет свободу. Покупка оружия на личные средства монарха — отчаянный шаг, но в тяжелой ситуации нужно действовать решительно."
 KLG_buy_rifles_from_host_cost: "§G[?KLG_buy_arms_from_host_cost]§! £GFX_KLG_imperial_treasury"
 KLG_buy_rifles_from_host_cost_blocked: "§R[?KLG_buy_arms_from_host_cost]§! £GFX_KLG_imperial_treasury"
 KLG_securing_arms_deals_flag: "Заключение сделки о покупке оружия"
 KLG_will_be_re_enabled_tt: "Это решение будет повторно доступно через [?KLG_re_enable_time_international_actions] д."
 KLG_buy_tanks_from_host: "Купить лишние [?KLG.host_nation.GetAdjective]ие танки"
 KLG_buy_tanks_from_host_desc: "[ROOT.GetAdjective]ая армия испытывает сильную нехватку танков. На рынке есть излишки старой техники, и ситуацию можно слегка улучшить, купив ее за счет средств из императорской казны. Старые танки лучше, чем никаких."
 KLG_buy_support_equipment_from_host: "Приобрести вспомогательное оснащение"
 KLG_buy_support_equipment_from_host_desc: "Винтовки — это еще не все. Солдатам нужны каски, сапоги, гранаты и многое прочее. Мы можем приобрести все это за счет средств из императорской казны."
 KLG_chitet_category: "Читет"
 KLG_chitet_category_desc: "Созыв национального ополчения обеспечивает быстрый доступ к большому количеству войск в регионе. За прошедшие столетия ополчение сослужило стране добрую службу. Когда война закончится, ополченцев можно отправить по домам, чтобы они вернулись к мирной жизни."
 KLG_raise_the_chitet: "Собрать читет"
 KLG_raise_the_chitet_desc: "Собрать ополчение во всех регионах Эфиопии, которые находятся под вашим контролем."
 KLG_disband_the_chitet: "Расформировать читет"
 KLG_disband_the_chitet_desc: "Когда война закончится, ополченцам придет пора вернуться по домам."
 KLG_chitet_cooldown_tt: "Читет можно снова собрать через [?var_KLG_chitet_cooldown] д. после роспуска."
 KLG_chitet_disband_tt: "После расформирования читета прошло [?var_KLG_chitet_cooldown] д."
 KLG_disband_the_chitet_mission: "Ополчение возвращается домой"
 KLG_disband_the_chitet_mission_desc: "Пора распустить читет и дать солдатам вернуться к мирной жизни."
 KLG_raise_the_chitet_effect_tt: "Собирает ополчение"
 KLG_number_levy_units_less_than_five: "Менее 5 действующих дивизий ополчения."
 KLG_second_italo_KLGiopian_war_category: "Вторая итало-эфиопская война"
 KLG_second_italo_KLGiopian_war_category_desc: "[Get2ndItaloKLGiopianWarDesc] "
 KLG_2ndItaloKLGiopianWar: "[ITA.GetName] незаконно вторгается на наши земли. Хоть мы и полноправный член Лиги Наций, мировое сообщество никак не реагирует на это нападение, решив, что происходящее — просто незначительная стычка в одной из колоний. \nМы должны доказать Лиге Наций, что один из ее членов ведет полномасштабную войну против нас. Это заставит мир принять меры, и [ITA.GetLeader] пострадает."
 ITA_2ndItaloKLGiopianWar: "Пока что Лига Наций не приняла никаких мер против нас и лишь осудила наш захват Эфиопии. Однако чем дольше длится этот конфликт и чем больше регулярных частей мы отправляем на фронт, тем выше вероятность того, что другие государства начнут вмешиваться в наши дела. Мы должны положить конец войне до того, как [KLG.GetLeader] убедит Лигу Наций перейти к решительным мерам."
 KLG_christmas_offensive_mission: "Рождественское наступление"
 KLG_christmas_offensive_mission_desc: "Наши войска по-прежнему идут вперед, но скорость продвижения падает, и скоро контратака захлебнется."
 KLG_time_based_war_escalation_mission: "Постепенная эскалация войны"
 KLG_time_based_war_escalation_mission_desc: "Чем дольше идет война, тем выше уровень обеспокоенности в мире. Уровень эскалации войны будет увеличиваться на единицу каждые полгода, начиная с октября 1935 года."
 KLG_started_uprising_flag: "Идет крупномасштабное восстание"
 KLG_hold_the_north_mission: "Удержать север"
 KLG_hold_the_north_mission_desc: "В ходе рождественского наступления нам удалось оттеснить итальянцев, но мы не сумели сбросить их в море. Они соберут новые силы и снова пойдут в наступление. Нам нужно доказать, что мы можем отстоять нашу родину."
 KLG_hold_the_north_mission_success: "\n[KLG.GetName] удерживает север (+1) £trigger_yes\n"
 ITA_conquer_the_north_mission: "Захватить северную Эфиопию"
 ITA_conquer_the_north_mission_desc: "Пора отбить у эфиопов земли, которые они захватили в ходе наступления."
 KLG_war_escalation_inc_tt: "Уровень эскалации войны повышается на §G1§!"
 KLG_war_deescalation_inc_tt: "Уровень эскалации войны понижается на §R1§!"
 ITA_war_escalation_inc_tt: "Уровень эскалации войны повышается на §R1§!"
 ITA_war_deescalation_inc_tt: "Уровень эскалации войны понижается на §G1§!"
 KLG_hold_the_south_mission: "Удержать юг"
 KLG_hold_the_south_mission_desc: "На южном фронте до сих пор было тихо, но итальянцы наверняка планируют провести там еще одну наступательную операцию. Мы должны остановить их и доказать всему миру, что требования итальянцев и их марионеток в Сомали являются незаконными."
 KLG_hold_the_south_mission_success: "\n[KLG.GetName] удерживает юг (+1) £trigger_yes\n"
 ITA_conquer_the_south_mission: "Захватить южную Эфиопию"
 ITA_conquer_the_south_mission_desc: "Вероятно, эфиопы не ожидают удара с юга. Мы должны подорвать боевой дух их армии и лишить их поддержки в Лиге Наций, быстро захватив регионы [837.GetName] и [836.GetName]."
 KLG_hold_addis_ababa_mission: "Удержать Аддис-Абебу"
 KLG_hold_addis_ababa_mission_desc: "Если мы отстоим нашу столицу, то, возможно, убедим мировое сообщество в том, что итальянцев нужно остановить силовыми методами."
 KLG_hold_the_capital_mission_success: "\n[KLG.GetName] удерживает Аддис-Абебу (+1) £trigger_yes\n"
 KLG_conquer_addis_ababa_mission: "Захватить Аддис-Абебу"
 KLG_conquer_addis_ababa_mission_desc: "Мы должны захватить столицу, и тогда [KLG.GetName] капитулирует."
 KLG_hold_harar_mission: "Удержать регион [835.GetName]"
 KLG_hold_harar_mission_desc: "Мы потеряли юг и теперь нам нужно отстоять Харэр и защитить выход к морю."
 KLG_harar_lost_tt: "Потеря контроля над Харэром снизит поддержку войны в народе."
 KLG_conquer_harar_mission: "Захватить регион [835.GetName]"
 KLG_conquer_harar_mission_desc: "Эфиопы собирают силы в горах. Нам нужно захватить регион [835.GetCapitalVictoryPointName], пока они не закрепились на своих позициях."
 KLG_hold_harar_mission_success: "\n[KLG.GetName] удерживает регион [835.GetName] (+1) £trigger_yes\n"
 KLG_buy_rifles: "Купить стрелковое оружие"
 KLG_buy_rifles_desc: "Теперь у нас есть выход на международный рынок оружия, и мы должны действовать. Прежде всего нужно приобрести винтовки, чтобы наша пехота могла на равных сражаться с захватчиками."
 KLG_buy_artillery: "Закупить артиллерию"
 KLG_buy_artillery_desc: "Наша армия отчаянно нуждается в современной артиллерии. Нам нужно прежде всего закупить тяжелое вооружение."
 KLG_buy_support_equipment: "Закупить вспомогательное снаряжение"
 KLG_buy_support_equipment_desc: "Нам нужно не только оружие, но также средства связи и дополнительное снаряжение в целом. Добыть все это — наша первоочередная задача."
 KLG_buy_anti_tank_guns: "Закупить противотанковые орудия"
 KLG_buy_anti_tank_guns_desc: "У итальянцев есть бронетехника, а у нас только канистры с бензином и охотничьи ружья. Нам нужна большая партия качественных противотанковых орудий, иначе эту войну мы проиграем."
 KLG_request_sent_flag: "Ожидает ответа"
 KLG_host_confirmed_flag: "Подтверждает возможность создать правительство в изгнании в этой стране"
 KLG_host_country_decision: "Попросить разрешение создать правительство в изгнании в государстве [FROM.GetName]."
 KLG_host_country_decision_desc: "Мы должны готовиться к худшему. Если вся территория страны будет захвачена, нам понадобится база, откуда мы сможем руководить сопротивлением. Нам необходимо обратиться к [FROM.GetAdjective]ому правительству и попросить разрешения создать на его территории правительство в изгнании."
 KLG_host_country_decision_tt: "§Y[ROOT.GetLeader]§! сможет создать §Yправительство в изгнании§! в стране §Y[FROM.GetNameWithFlag]§!, если до капитуляции успешно выполнен фокус §Y$KLG_boarding_the_train$§!. \n\nОткрывает дополнительные фокусы, если правительство в изгнании будет создано в стране [FROM.GetNameDef]."
 ITA_expand_regional_control: "Установить контроль над регионом [FROM.GetName]"
 ITA_expand_regional_control_desc: "Мы расширим [ITA.GetAdjective]ий контроль над государством [FROM.GetName]."
 ITA_discredit_haile_selassie_cd_tt: "[GetDecisionCooldownTooltip] §Y180§! дней.\n"
 expanding_regional_control_flag: "Установление контроля над регионом"
 KLG_italian_occupation_category: "[ITA.GetAdjective]ая оккупация региона [KLG.GetName]"
 KLG_italian_occupation_category_desc: "Хоть мы и были вынуждены уйти с родной земли, война далека от завершения. Мы используем все доступные возможности, чтобы снова дать [KLG.GetAdjective]ому народу свободу."
 KLG_italian_occupation_category_map_category_name: "Управлять [ITA.GetAdjective]ой оккупацией региона [KLG.getNameDef]"
 KLG_italian_control_mission: "[ITA.GetName] интегрирует территорию региона [?ITA.state_integrated.GetName]"
 KLG_italian_control_mission_desc: "[ITA.GetName] пытается установить контроль над нашей территорией с помощью грубой силы. Мы должны оттеснить врага."
 KLG_italian_control_mission_tt: "[?ITA.state_integrated.GetName] будет принадлежать государству [ITA.GetNameWithFlag]."
 KLG_retake_territory_mission: "Отбить территорию"
 KLG_retake_territory_mission_desc: "[ROOT.GetName] наполовину находится во власти противника. Местные расы недовольны тем, что их территории бросили, и сомневаются в эффективности центральной власти. Говорят, что они хотят заключить сделку с итальянцами. Единственный способ убедить людей в победе — это захватить [ROOT.GetAdjective]ую территорию."
 controls_50_percent_of_territory: "[ROOT.GetNameWithFlag] контролирует не менее §Y50%§! от общего числа территорий.\n Контроль на данный момент: [?num_owned_controlled_states|Y0]\n Необходимо: [?controlled_owned_50|Y0] "
 controls_more_than_50_percent_of_territory: "[ROOT.GetNameWithFlag] контролирует более §Y50%§! от общего числа территорий.\n Контроль на данный момент: [?num_owned_controlled_states|Y0]\n Необходимо: [?controlled_owned_more_than_50|Y0] "
 KLG_road_reform_BoP: "Дорожные улучшения"
 KLG_Education_reform_decentralized_BoP: "Локальные реформы образования"
 KLG_Education_reform_decentralized_BoP_tt: "Образование — один из главных наших методов борьбы с устаревшими властными структурами. Нам нужно так выучить молодежь, чтобы она начала подвергать сомнению действия власти и отвергала старые традиционалистские воззрения."
 KLG_Education_reform_centralized_BoP: "Государственные реформы образования"
 KLG_Education_reform_centralized_BoP_tt: "Главное для нас — сделать все, чтобы следующее поколение смогло занять свои места в рядах рабочей силы. У нас есть возможность подтолкнуть это поколение в правильном направлении и проследить, чтобы оно знало твердо: [KLG.GetLeader] — его рулевой."
 KLG_road_reform_local_BoP: "Поддержать развитие местных дорог"
 KLG_road_reform_highways_BoP: "Поддержать развитие столичных шоссе"
 KLG_road_reform_local_BoP_desc: "Дорожная сеть [KLG.GetNameRuGen] все сильнее мешает дальнейшему экономическому развитию. Теперь у нас достаточно политического влияния, чтобы настаивать на модернизации дорог. Улучшение дорожной сети между городами и деревнями пойдет на пользу жителям."
 KLG_road_reform_highways_BoP_tt: "Дорожная сеть [KLG.GetNameRuGen] все сильнее мешает дальнейшему экономическому развитию. Нужно воспользоваться новообретенным влиянием и ускорить экономическое развитие и централизацию, начав строить вокруг столицы новые эффективные шоссе."
 KLG_officer_reforms_centralized_BoP: "Ввести институт политруков"
 KLG_officer_reforms_decentralized_BoP: "Повышение меритократии в армии"
 KLG_officer_reforms_centralized_BoP_tt: "Чтобы быть уверенными в лояльности армии, нужно ввести в нее специальных офицеров-политруков."
 KLG_officer_reforms_decentralized_BoP_tt: "Чтобы быть уверенными в эффективности армии, нужно повысить уровень меритократии в офицерском корпусе."
 KLG_BoP_purge_communists: "Изгнать коммунистов"
 KLG_BoP_purge_communists_tt: "Шаткий мир между Черными львами и офицерами-коммунистами начинает рушиться. Офицеры явно намерены централизовать власть и создать лояльное себе авторитарное государство. Нужно устранить их, пока они не разрушили все, что мы построили."
 KLG_BoP_purge_anarchists: "Изгнать анархистов"
 KLG_BoP_purge_anarchists_tt: "Шаткий мир между «Черными львами» и армией начинает рушиться. Их наивные анархистские воззрения привели к тому, что [KLG.GetNameDef] разрушается изнутри и вскоре не сможет противостоять атакам. Чтобы гарантировать, что революция не зачахнет, нужно разделаться с «Черными львами» раз и навсегда.\n\n§Y$KLG_prov_mil_admin$§! станет лидером государства §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!."
 KLG_BoP_expand_black_lions: "Увеличить дивизии Черных львов"
 KLG_BoP_expand_black_lions_tt: "Коммунистам нельзя доверять. Мы должны быть начеку на тот случай, если они попытаются захватить власть. Следовательно, нужно увеличить количество дивизий Черных львов, чтобы устрашить коммунистов."
 KLG_BoP_expand_red_guards: "Увеличить дивизии Красной гвардии"
 KLG_BoP_expand_red_guards_tt: "Доверять Черным львам управление страной нельзя, их необходимо отстранить от власти. Мы должны нарастить количество отрядов Красной гвардии, чтобы на момент неминуемого падения Черных львов у нас было преимущество."
 KLG_electrify_state: "Электрификация страны [FROM.GetName]"
 KLG_electrify_state_desc: "Проведение электросетей в деревни жизненно необходимо для модернизации страны."
 KLG_electrify_state_tt: "§Y$KLG_state_development_dynamic_modifier$§! изменится на:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§! \n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 KLG_improve_communications_in_state: "Улучшить инфраструктуру связи в государстве [FROM.GetName]"
 KLG_improve_communications_in_state_desc: "Эффективная связь крайне важна для модернизации страны."
 KLG_improve_communications_in_state_tt: "§Y$KLG_state_development_dynamic_modifier$§! изменится на: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!"
 KLG_invest_in_state_industry: "Инвестиции в промышленность региона [FROM.GetName]"
 KLG_invest_in_state_industry_desc: "Если [FROM.GetName] хочет создать эффективную промышленность, потребуются государственные инвестиции — либо прямые, либо от местных правителей."
 KLG_invest_in_state_industry_tt: "§Y$KLG_state_development_dynamic_modifier$§! изменится на: \n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
 prospecting_ongoing_flag: "Добыча ресурсов уже идет"
 KLG_prospect_for_resources: "Добыча ресурсов"
 KLG_prospect_for_resources_desc: "[FROM.GetName] — место, располагающее природными ресурсами. Если пробурить скважины поглубже, [ROOT.GetName] станет богаче."
 KLG_japanese_industrial_investments_decision: "Японские инвестиции в промышленность"
 KLG_japanese_industrial_investments_decision_desc: "Японские предприниматели ищут новые возможности вложить средства в Африку. [FROM.GetName] идеально подходит для инвестиций в промышленность."
 KLG_japanese_investments_flag: " Японцы уже инвестируют средства "
 KLG_local_development_state_grows_mission: "Рост в регионе [?KLG.KLG_local_state.GetName]"
 KLG_local_development_state_grows_mission_desc: "В данный момент [?KLG.KLG_local_state.GetName] процветает. Производство сельскохозяйственной продукции увеличивается, города и деревни растут."
 KLG_max_japanese_investments_tt: "Инвестировать средства можно не более чем в §Y3§! региона. Число регионов, в которые уже вложены средства: §Y[?KLG_japanese_invesment_states]§!"
 KLG_japanese_infrastructure_investments_decision: "Японские инвестиции в инфраструктуру"
 KLG_japanese_infrastructure_investments_decision_desc: "Японские предприниматели ищут новые возможности вложить средства в Африку. [FROM.GetName] идеально подходит для инвестиций в инфраструктуру."
 KLG_japanese_dockyard_investments_decision: "Японские инвестиции в кораблестроение"
 KLG_japanese_dockyard_investments_decision_desc: "Японские предприниматели ищут новые возможности вложить средства в Африку. [FROM.GetName] идеально подходит для инвестиций в судостроительные заводы."
 KLG_local_development_industry_grows_mission: "Промышленная экспансия в регионе [?KLG.KLG_local_state.GetName]"
 KLG_local_development_industry_grows_mission_desc: "В регионе [?KLG.KLG_local_state.GetName] процветает мелкосерийное производство. Если мы будем и дальше стимулировать его, [ROOT.GetName] только выиграет."
 KLG_local_development_arms_industry_grows_mission: "Производство оружия в регионе [?KLG.KLG_local_state.GetName]"
 KLG_local_development_arms_industry_grows_mission_desc: "Производители оружия в регионе [?KLG.KLG_local_state.GetName] значительно повысили количество выпускаемой продукции. Еще немного, и это принесет пользу всей стране."
 KLG_local_development_improved_production_mission: "В регионе [?KLG.KLG_local_state.GetName] формируются местные строительные комитеты"
 KLG_local_development_improved_production_mission_desc: "Местные комитеты улучшают условия работы, инструменты и методы производства в регионе [?KLG.KLG_local_state.GetName]."
 KLG_local_development_improved_production_mission_tt: "§Y$KLG_state_development_dynamic_modifier$§! изменится на: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 KLG_anti_colonialism_category: "Антиколониализм"
 KLG_anti_colonialism_category_desc: "Мы сделаем все возможное, чтобы поддержать движения сопротивления по всему региону, пока с чумой империализма не будет покончено."
 KLG_anti_colonialism_map_category_name: "Регионы-колонии, где можно поддержать сопротивление"
 KLG_support_resistance_decision: "Поддержать [FROM.OWNER.GetAdjective]ое сопротивление в регионе [FROM.GetName]"
 KLG_support_resistance_decision_desc: "Поддержать бойцов сопротивления, чтобы свергнуть [FROM.Owner.GetAdjective]ое правление."
 KLG_arm_resistance_decision: "Вооружить людей, оказывающих сопротивление [FROM.OWNER.GetAdjective]ому государству в регионе [FROM.GetName]"
 KLG_arm_resistance_decision_desc: "Вооружить бойцов сопротивления в этом регионе."
 KLG_support_independence_decision: "Поддержать [FROM.GetAdjective]ую независимость"
 KLG_support_independence_decision_desc: "Поддержать [FROM.GetAdjective]ую независимость"
 KLG_independence_support_progress_flag: " В данный момент поддерживает движение за независимость"
 KLG_support_resistance_decision_cost: "£command_power §Y25§!"
 KLG_support_resistance_decision_cost_blocked: "£command_power §R25§!"
 KLG_anti_colonialism_decision: "Пропаганда против [FROM.GetAdjective]ого правления"
 KLG_anti_colonialism_decision_desc: "[FROM.GetAdjective]ому империализму в Африке нужно положить конец. Мир должен очнуться и понять, что эпоха [FROM.GetAdjRuLower]ого колониализма закончилась. Люди [FROM.GetNameRuGen] должны оказать давление на своих лидеров и добиться независимости для африканских колоний."
 KLG_demand_peace_decision: "Потребовать у [?FROM.previous_overlord.GetAdjective]ого народа признать государство [FROM.GetNameDef]"
 KLG_demand_peace_decision_desc: "Храбрый народ [FROM.GetNameRuGen] восстал против [?FROM.previous_overlord.GetAdjRuLower]ой тирании. Мы должны немедленно сделать все возможное, чтобы вынудить [?FROM.previous_overlord.GetNameRuAcc] покинуть [FROM.GetAdjRuLower]ую территорию."
 KLG_demand_peace_decision_tt: "§Y[?FROM.previous_overlord.GetNameWithFlag]§! находится под давлением: от лидера требуют прекратить войну с государством §Y[FROM.GetNameWithFlag]§!"
 KLG_currently_demanding_peace_flag: " В данный момент требует мира"
 KLG_social_reforms_category: "Анархо-коммунистические социальные реформы"
 KLG_social_reforms_category_desc: "Нам нужны социальные реформы, которые решат культурные и религиозные разногласия в государстве [KLG.GetName] и объединят страну."
 KLG_education_reforms_decision: "Реформы системы образования"
 KLG_education_reforms_decision_desc: "Чтобы предотвратить усиление реакционеров, мы должны реформировать образование. Тогда наши дети вырастут свободомыслящими и не станут прислугой капиталистов."
 KLG_collectivization_reforms_decision: "Земельная реформа"
 KLG_collectivization_reforms_decision_desc: "Землю в государстве [KLG.GetNameDefCap] обрабатывает народ, но она уже много веков принадлежит знати. У нас есть возможность перераспределить территории так, чтобы каждый стал сам себе господином."
 KLG_secularization_reforms_decision: "Секуляризация"
 KLG_secularization_reforms_decision_desc: "[KLG.GetNameDefCap] — клубок культурных и религиозных противоречий, уходящих корнями в глубину веков. Нам нужно устранить суеверия, иначе в будущем в стране начнутся столкновения между представителями разных религий."
 KLG_freedom_at_gunpoint_category: "Свобода под дулом пистолета"
 KLG_freedom_at_gunpoint_category_desc: "Наши соседи остаются под игом империализма. Нам пора применить наш боевой опыт и экономическую мощь в деле освобождения Африки. Мы будем общаться с колониалистами на том языке, который они понимают, — на языке грубой силы."
 KLG_freedom_at_gunpoint_dynamic: "Освободить государство [FROM.GetName] от власти державы [FROM.Capital.OWNER.GetName]"
 KLG_freedom_at_gunpoint_dynamic_tt: "Появляются §Yцели войны «Освободить государство»§! против государства §Y[FROM.Capital.OWNER.GetName]§!"
 KLG_has_active_liberation_goal: "Имеет активную цель войны по освобождению"
 form_KLGiopian_empire_category: "Расширение [KLG.GetAdjective]ой империи"
 form_KLGiopian_empire_category_desc: "[ROOT.GetNameDefCap] уже является могучей империей, однако государство далеко не то, каким оно было раньше. Впрочем, при правильном руководстве страна может стать еще сильнее."
 KLG_italo-KLGiopian_empire_decisions: "Расширение Итало-[KLG.GetAdjective]ой империи"
