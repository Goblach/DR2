 KLG_exploit_french_weakness_category_desc: "Когда настанет время, мы станем контролировать регион [268.GetName] — [FRA.GetAdjective]ому государству будет не до того, оно отвлечется на внутренние дела."
 KLG_take_DJI: "Занять Французский Берег Сомали"
 KLG_take_DJI_tt: "Мы должны дождаться подходящего момента для удара. Когда Французский Берег Сомали будет свободен, мы сможем быстро захватить территорию. Франция, скорее всего, согласится с нашими притязаниями на нее, но мы все равно должны быть готовы к более масштабному конфликту."
 KLG_take_DJI_cancel_tt: "\n§RБудет отменено, если $FRA_VICHY_fascism$ больше не контролирует Французский Берег Сомали или разместит в регионе свои дивизии!§!"
 KLG_take_DJI_danger_tt: "\n§R$FRA_VICHY_fascism$ может нанести ответный удар в отместку за аннексирование территорий!§!"
