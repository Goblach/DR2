 ZHE_lucy_desc: "Правила этикета настоящей принцессы: \n-избивать врага бейсбольной битой со всем возможным уважением; \n-не забыть извиниться перед врагом, лежащим у ваших ног."
 GAL_Klyaner_desc: "Время замутить перекусончик.\nА у меня тут в нычке варёные яички, хлебушек, консервы и конечно кура-гриль.\nМаслята и лисички, килограмм клубнички, сосиски, колбаса и минералочки бутыль.\nЁще к чаю есть ватрушки, тортик, вафли, сушки, чипсы взял похрустеть и попкорн, мармеладки-залипушки"